function home(){stopTimer();S=null;current=null;const old=load();$('main').innerHTML=`<section class="hero"><div><div class="eyebrow">VALUES EDUCATION / 跨代人生互動遊戲</div><h1>不怕囉唆<span class="amp">&</span><br>最怕生疏</h1><p class="intro">從被照顧的孩子，到牽掛子孫的長輩。<br>走過85年，練習把「我知啦」變成「我想聽」。</p><span class="pill">0—85歲人生旅程</span><span class="pill">每次相遇都不同</span><span class="pill">約15—25分鐘</span><form id="entry"><label for="name" class="small">你的姓名或暱稱</label><div class="entry"><input id="name" maxlength="24" autocomplete="off" placeholder="輸入暱稱即可" required><button type="submit">展開我的人生 ↗</button></div></form><div class="actionrow">${old?'<button class="secondary" id="resume">繼續上次旅程</button>':''}<button class="outline" onclick="instructions()">玩法說明</button></div><div id="notice" role="status"></div><p class="source-notice">含家人離世及喪親情節；可隨時暫停、稍後繼續。姓名及進度只儲存於此瀏覽器；分享前可預覽內容。</p></div>${art()}</section><section class="objectives"><div class="objective"><b><span class="num">01</span>以尊重，靠近彼此</b><span>主動溝通，接納不同步伐與生活經驗。</span></div><div class="objective"><b><span class="num">02</span>以同理，聽懂需要</b><span>看見叮嚀背後的牽掛，也溫柔說出界線。</span></div><div class="objective"><b><span class="num">03</span>以陪伴，傳承孝親</b><span>從家常菜、節慶與家族故事珍惜中華文化。</span></div></section>`;$('entry').onsubmit=e=>{e.preventDefault();const n=$('name').value.trim();if(!n){$('notice').textContent='請先輸入姓名或暱稱。';return}if(old){modal('開始新的人生？',`<p>新旅程會覆蓋本機原有進度。你亦可先繼續舊旅程。</p><div class="actionrow"><button id="confirmNew">開始新旅程</button><button class="secondary" onclick="closeModal()">返回</button></div>`);$('confirmNew').onclick=()=>{closeModal();newGame(n)}}else newGame(n)};if(old)$('resume').onclick=()=>{S=old;S.running=false;current=null;render()}}
function instructions(){modal('怎樣走過這85年',`<p>輸入暱稱後，系統隨機安排你的家庭、長輩及未來子孫。先看家庭圖鑑，了解每個人的背景。</p><ol><li>年齡會逐年自動前進；遇到對話、家人離世或人口小問答時會停下。</li><li>少年時選擇回應長輩；成年後逐漸承擔照顧角色；孫兒出生後由你選擇怎樣開口。</li><li>親密度是遊戲中的溝通回饋，不是孝心評分。不同性格、健康需要及生活壓力會影響回應。</li><li>每次作答後先看對方的反應，再按「繼續人生」。可隨時暫停或調整推進速度。</li><li>85歲時人生結束，回顧關係、寫下反思及行動，預覽後自行分享。</li></ol><div class="banner">嬰兒／幼兒情境是代入式選擇，不要求嬰兒承擔照顧責任。離世時間為隱藏故事設定，與你的選擇無關。孝親包括尊重、聆聽和合理界線，並非無條件服從。</div><p class="small">每個家庭都值得尊重。離異、喪偶、不同教育程度、性別、健康或經濟狀況不決定一個人的品格。</p>`)}

function loc(p){return p.local?(p.co?'香港 · 與你同住':'香港 · 分開居住'):`${p.place} · 定期電話／視像聯絡`}
function hp(h){return `${h.mob}；${h.vision}；${h.hearing}；${h.speech}；${h.understanding}；${h.chronic}`}
function personCard(x,type){const a=type==='elder'?x.startAge+S.age:S.age-x.birthAt;return `<article class="profile"><h3>${x.sex==='男'?'👨':'👩'} ${esc(x.role)} <span class="small">${x.dead?'已離世':a+'歲'}</span></h3><span class="chip">${esc(x.personality)}</span><span class="chip">${esc(x.sex)}</span><p>${esc(x.edu)} · ${esc(x.job)}${type==='elder'?'（曾任／現任）':''}</p>${x.background?`<p>${esc(x.background)}</p>`:''}<p><b>居住：</b>${esc(loc(x))}</p><p><b>健康：</b>${esc(hp(x.health))}</p><p><b>經濟：</b>${esc(x.eco)}</p>${x.children&&Array.isArray(x.children)?`<details><summary>子女狀況 · ${x.children.length}位</summary>${x.children.map(c=>`<p>${esc(c.role)}：${esc(c.job)}，${esc(c.marital)}，${c.children}名子女。</p>`).join('')}</details>`:''}${type==='grand'?`<p>父母：${esc(S.children.find(c=>c.id===x.parentId).role)}；${S.age<18+x.birthAt?'教育／職業為成年後設定。':'已成年。'}</p>`:''}${type==='child'?`<p>婚姻：${esc(x.marital)}；${x.children}名子女（隨人生陸續出生）。</p>`:''}<p><b>關係：</b>${x.bond}/100 · ${esc(x.pattern)}</p></article>`}
function showFamily(){if(!S){modal('每個家庭，都有自己的故事','<p>開始人生後，這裡會展示隨機家庭背景、長輩及逐漸出生的子孫。壽命不會顯示，請珍惜眼前的相處機會。</p>');return}const p=S.p,children=S.children.filter(c=>c.birthAt<=S.age),grand=S.grand.filter(c=>c.birthAt<=S.age);modal('我的家庭圖鑑',`<div class="banner"><b>${esc(p.name)}</b> · ${p.sex} · ${S.age}歲 · ${stages(S.age)}<br>教育路徑：${p.edu}；成年後職業：${p.job}；經濟：${p.eco}<br>兄弟姊妹${p.siblings}位。父母婚姻：${p.marital}${p.lateParent?'（'+p.lateParent+'已離世）':''}。<br>${p.parents.map(x=>`${x.role}：${x.job}${p.lateParent===x.role?'（已離世）':''}`).join('；')}。<br>你的健康設定：${esc(hp(p.health))}</div><h3>上一代的牽掛 · ${S.elders.length}位長輩</h3><div class="familygrid">${S.elders.map(x=>personCard(x,'elder')).join('')}</div><h3 style="margin-top:24px">延續的陪伴</h3>${children.length?`<div class="familygrid">${children.map(x=>personCard(x,'child')).join('')}</div>`:'<p class="small">子女尚未出生；往後會逐漸出現。</p>'}${grand.length?`<h3 style="margin-top:24px">孫輩</h3><div class="familygrid">${grand.map(x=>personCard(x,'grand')).join('')}</div>`:''}<p class="small">全部人物均為虛構。角色特徵採教學用隨機抽樣，並非香港人口的代表性樣本；婚姻、教育和職業不作價值判斷。圖鑑不顯示壽命。</p>`)}
function showSources(){modal('人口資料與教師手冊',`<p>人口老化讓跨代共處更常見；數據幫助理解社會背景，具體需要則要透過對話了解。</p>${facts.map(f=>`<div class="sourcecard"><h3>${esc(f.org)}</h3><strong>${esc(f.big)}</strong><p>${esc(f.text)}</p><a href="${f.url}" target="_blank" rel="noopener noreferrer">查看原始資料 ↗</a></div>`).join('')}<div class="banner"><b>資料口徑與遊戲設定</b><br>核對日期：2026年10月28日。聯合國與WHO數字包含推算；世界銀行指標採65歲門檻，WHO上述數字採60歲門檻，不可混用。香港採2024年生命表資料，沒有把較早的臨時數字82.8／88.4當作定案數字。<br>本作採人口統計作知識卡及反思題，不以群體平均數推算個人。85歲終點、角色健康、壽命、家庭規模及性格為教學情境規則，並非統計模型。回應不改變離世時間。</div><details open><summary>建議課堂安排（35—40分鐘）</summary><ol><li>引入5分鐘：最近聽過哪一句長輩叮嚀？可能藏著甚麼需要？</li><li>個人遊玩15—25分鐘：比較「回應」與「對方反應」，留意健康及居住安排。</li><li>同儕交流5分鐘：同一句關心，怎樣兼顧界線？</li><li>反思5分鐘：寫下陪伴時間、真切需要及一項可實行的約定。</li></ol><p>學生可用暱稱，不要求披露真實家庭狀況；可選擇與信任的年長親友或社區長者連結。遇喪親不適可暫停，向老師或可信任成人尋求支持。</p></details><details><summary>文化與價值觀重點</summary><p>透過農曆新年問候、團年飯、家常菜、家族故事與重陽敬老體會孝親。核心是關心與尊重自主；家人提出不合理要求時，可禮貌拒絕並商議替代方法。</p></details><p class="small">附件狀態：本次未收到可識別的附件，現版本依據使用者列明的規格及上述機構資料編寫。</p>`)}
function shell(inner){const f=facts[Math.floor(S.age/23)%4];$('main').innerHTML=`<section class="apphead"><div class="ageblock"><span class="age">${S.age}</span><div><b>歲 · ${stages(S.age)}</b><div class="small">${esc(S.p.name)}的人生旅程</div></div></div><div><button id="pause" class="outline" onclick="togglePause()">${S.running?'Ⅱ 暫停':'▶ 繼續推進'}</button> <select class="speed" aria-label="年齡推進速度" onchange="setSpeed(this.value)"><option value="1000" ${S.speed===1000?'selected':''}>慢速</option><option value="500" ${S.speed===500?'selected':''}>標準</option><option value="120" ${S.speed===120?'selected':''}>快速</option></select></div></section><div class="progress" role="progressbar" aria-label="人生進度" aria-valuemin="0" aria-valuemax="85" aria-valuenow="${S.age}"><div style="width:${S.age/85*100}%"></div></div><div class="ticks"><span>0歲 · 被照顧</span><span>成長 · 理解</span><span>85歲 · 傳承</span></div><div class="gamegrid"><section class="panel event" id="event" aria-live="polite">${inner}</section><aside class="sidebar"><div class="panel"><h3>牽掛的人</h3>${S.elders.map(x=>mini(x,'elder')).join('')}${S.grand.filter(g=>g.birthAt<=S.age).map(x=>mini(x,'grand')).join('')}<button class="outline" style="width:100%;margin-top:8px" onclick="showFamily()">了解家人的需要 ↗</button></div><div class="panel fact"><span class="eyebrow" style="color:#e9bd66">人口視野</span><strong>${f.big}</strong><p class="small">${f.text}</p><a href="${f.url}" target="_blank" rel="noopener noreferrer" class="small">${f.org} ↗</a></div><div class="panel"><b>陪伴小提醒</b><p class="small" style="margin:8px 0 0">先問需要，再給幫助。<br>一句「你想怎樣？」<br>可以比十句「你應該」更親近。</p></div></aside></div>`}
function mini(x,type){return `<div class="relative"><span class="icon" aria-hidden="true">${x.dead?'🌿':type==='elder'?(x.sex==='男'?'👴':'👵'):'🧑'}</span><button onclick="showFamily()">${esc(x.role)} <span class="status">${x.dead?'已離世':(type==='elder'?x.startAge+S.age:S.age-x.birthAt)+'歲'}</span><div class="meter" aria-label="親密度${x.bond}分"><div style="width:${x.bond}%"></div></div><span class="status">${x.bond}/100 · ${esc(x.pattern)}</span></button></div>`}
function render(){stopTimer();if(S.mode==='intro'){shell(`<div class="eyebrow">PROLOGUE / 每個故事，都從相遇開始</div><h2>你好，${esc(S.p.name)}。<br>歡迎來到你的第一天。</h2><p>你被安排為${S.p.sex}性，家中有${S.p.siblings}位兄弟姊妹，${S.elders.length}位長輩。你的成長路徑是${S.p.edu}，成年後將成為${S.p.job}。</p><div class="banner">家庭的起點無法選擇，相處的方法卻可以慢慢學。先了解他們，再展開對話。</div><div class="actionrow"><button onclick="begin()">從0歲開始 →</button><button class="outline" onclick="showFamily()">查看家庭背景</button></div><p class="small" style="margin-top:20px">壽命不會顯示。親密度不影響生死，也不評定誰是「好家人」。</p>`)}else if(S.mode==='summary')summary();else if(S.mode==='event'){if(!current)current=makeCurrent();renderEvent()}else {shell(`<div class="loading"><span class="leaf">🌿</span><h2>${S.running?'日子，慢慢向前。':'把人生暫停一下。'}</h2><p class="muted">${S.running?'下一段相遇正在路上……':'進度已留在此瀏覽器。準備好後，按右上方繼續推進。'}</p></div>`);if(S.running)startTimer()}}
function begin(){S.mode='travel';S.running=true;advance(true)}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
function startTimer(){stopTimer();if(S.mode==='travel'&&S.running&&!$('modal').open)timer=setInterval(()=>advance(false),S.speed)}
function togglePause(){S.running=!S.running;save();if(S.mode==='travel')render();else {$('pause').textContent=S.running?'Ⅱ 暫停':'▶ 繼續推進';toast(S.running?'作答後，年齡會自動繼續推進。':'已暫停；你仍可閱讀及作答。')}}
function setSpeed(v){S.speed=Number(v);save();if(S.mode==='travel'&&S.running)startTimer()}
function pending(){const death=S.elders.find(e=>!e.dead&&e.deathAt<=S.age);if(death)return {type:'death',id:death.id};const gd=S.grand.find(g=>!g.dead&&g.birthAt<=S.age&&g.deathAt<=S.age);if(gd)return {type:'death',id:gd.id};const child=S.children.find(c=>c.birthAt<=S.age&&!S.births.includes(c.id));if(child)return {type:'birth',id:child.id};const grand=S.grand.find(g=>g.birthAt<=S.age&&!S.births.includes(g.id));if(grand)return {type:'birth',id:grand.id};const qi=[10,24,49,70].findIndex(a=>a<=S.age&&!S.quizDone.includes(a));if(qi>=0)return {type:'quiz',index:qi,key:[10,24,49,70][qi]};if(ages.includes(S.age)&&!S.done.includes(S.age))return {type:'story'};return null}
function advance(same=false){stopTimer();const p=pending();if(p){S.pending=p;S.mode='event';current=makeCurrent();save();renderEvent();return}if(S.age>=85){S.mode='summary';S.running=false;save();summary();return}if(!same)S.age++;const q=pending();if(q){S.pending=q;S.mode='event';current=makeCurrent();save();renderEvent()}else if(S.age>=85){S.mode='summary';S.running=false;save();summary()}else{S.mode='travel';save();render()}}
function findPerson(id){return [...S.elders,...S.grand,...S.children].find(x=>x.id===id)}
function makeCurrent(){const p=S.pending;if(p.type==='death'){const x=findPerson(p.id);return {type:'death',person:x,title:'有些聲音，留在了心裡。',text:`${x.role}在這一年離世。你回想起那些問候、擔心，還有未說完的故事。`,context:'離世由預先隨機的故事設定觸發，與你的回應無關。傷心、平靜或不知所措都可以；每個人的哀傷步伐不同。'}}if(p.type==='birth'){const x=findPerson(p.id),grand=x.id[0]==='g';return {type:'birth',person:x,title:grand?'換你，成為被牽掛的長輩。':'新的生命，新的牽掛。',text:`${x.role}出生了。${grand?'當年聽過的叮嚀，你會怎樣說出口？':'工作、休息與陪伴之間，你開始學習協調。'}`,context:grand?`居住安排：${loc(x)}。往後的選擇會按其年齡、健康、性格及生活情況改變。`:'養育與照顧需要家人共同分擔；關心上一代，也要照顧自己的需要。'}}if(p.type==='quiz')return {type:'quiz',fact:facts[p.index]};return story()}
function channel(x,grand=false){if(!x.local)return `跨地${x.health.hearing==='聽力較弱'?'字幕視像':'電話／視像'}聯絡（已約定定期聯絡）`;if(x.co)return '家中相處';return grand?'預先約好的探訪':'探訪長輩'}
function opt(text,d,reply,lesson,tag){return {text,d,reply,lesson,tag}}
function story(){const age=S.age,gs=S.grand.filter(g=>g.birthAt<=age&&!g.dead);if(gs.length)return grandStory(gs[S.eventIndex%gs.length]);const es=S.elders.filter(e=>!e.dead);if(es.length)return elderStory(es[S.eventIndex%es.length]);return bridgeStory()}
function elderStory(x){const a=S.age,h=x.health,aff=x.bond>=65?'上次你願意聽，讓我很安心。':x.bond<35?'你最近都不太回應，我又擔心又不知怎樣開口。':'',tone=x.bond<35?'話語帶著責備':'叮嚀中帶著關心';let title,text,opts,ctx='';
if(a<2){title='最初的依靠';text='「又醒了？肚餓嗎？凍不凍？我在這裡，慢慢來。」';ctx='你還不會說話。以下選項是代入嬰兒的需要，不是考驗嬰兒的責任。';opts=[opt('伸手尋求安撫，讓照顧者回應需要。',8,'「我看見你想有人抱抱，我會留心你的反應。」','嬰兒以表情和動作表達需要，成人負責辨識與照顧。','安全依附'),opt('望向熟悉的聲音，慢慢安靜下來。',8,'長輩放慢語速，在旁輕聲陪伴。','非語言回應也是連結；不能因嬰兒哭鬧而責怪他。','非語言溝通'),opt('不舒服而哭泣，等待成人協助。',8,'「哭是在告訴我你需要幫忙。我再看看原因。」','哭泣不是不孝或任性，照顧者應溫柔回應。','表達需要')];}
else if(a<6){title='一件外套的叮嚀';text='「跑慢點！著返件外套，唔好凍親！聽到未呀？」';opts=[opt('「我有點熱，我們一起摸摸手，看看要不要穿？」',10,'「原來你會熱，我先替你拿著，冷了再穿。」','接住關心，也能練習說出身體感受。','溫柔表達'),opt('「知啦知啦！」跑開繼續玩。',-7,'「又不聽！我只好再叫你幾次。」','沒有確認需要，容易讓擔心變成重複叮嚀。','敷衍'),opt('「你陪我慢慢走，可以嗎？」',12,'「好，我們一起走。你願意叫我陪，我很開心。」','陪伴可以從一個小邀請開始。','邀請陪伴')];}
else if(a<12){title=a===6?'放學後的連環問候':'團年飯與家常味';text=a===6?'「今日食咗飯未？做完功課未？書包重唔重？又咁遲返嚟？」':'「過年要一家人食飯。這道菜以前你爸爸媽媽最愛吃，我再講一次給你聽……」';opts=[opt(a===6?'「我吃過了。你今天過得怎樣？我們坐下來聊。」':'「我想知道這道菜的故事，我可以幫你一起準備嗎？」',13,'「你肯問我，我也想聽聽你的生活。」','問候不只回報近況，也讓長輩感到自己被在乎。傳承可由一起做一道菜開始。','主動聆聽'),opt('一邊滑手機，一邊說「嗯，知道」。',-9,'「你有沒有聽見？我再說一次……」','含糊回應可能增加重複提醒；先說明可聊天的時間更清楚。','分心'),opt('「我想先休息15分鐘，然後放下手機陪你，可以嗎？」',9,'「好，有個約定，我就不用一直問。」','合理界線配上具體約定，比消失或敷衍更有幫助。','協商界線')];}
else if(a<18){title=a===12?'問候，還是追問？':'被比較的成績';text=a===12?'「返到屋企要報平安！我打咗兩次電話，你又唔接，去咗邊呀？」':'「成績點解跌咗？隔籬個孫考得咁好，你有冇用心？我講你又嫌煩！」';opts=[opt('「我明白你擔心，但連環追問／比較讓我有壓力。我們約好報平安和談近況的時間？」',13,'「我原來令你有壓力。我試著先聽你說，也和你約好時間。」','同理心不等於接受所有說話。清楚描述感受、需要和可行約定。','尊重與界線'),opt('「你好煩呀，以後不要理我！」',-13,'「你這樣說，我很難過。」之後對話變少，提醒卻更急。','生氣可以理解；稍停再談，避免用拒絕關係來表達界線。','衝突'),opt('「嗯。」然後不再回覆任何訊息。',-9,'「是不是發生甚麼事？」長輩不安地再次追問。','沉默容易留下不確定。可以先說「我需要冷靜，今晚再談」。','疏離')];}
else if(a<25){title='當生活開始忙碌';text='「讀書／工作忙，都要食飯呀！你上次話會搵我，之後就冇聲氣。幾時得閒？」';opts=[opt('「抱歉讓你等。我想每週約一晚聊15分鐘，也想問你最近最需要甚麼。」',14,'「時間不長也好，知道你記得，我就安心。」','可持續的小約定比沒有把握的大承諾更實在。','定期聯絡'),opt('「遲啲先啦。」沒有再安排。',-10,'「又是遲些……我不知道還能不能再問。」','沒有下文會讓等待變成失落；可以給明確替代時間。','延後'),opt('寄一份禮物，說「收到就不用再打來了」。',-8,'「謝謝禮物，但其實我想聽你的聲音。」','物質支持與情感陪伴是不同需要，先問對方想要甚麼。','忽略需要')];}
else {title='關心，也要先問';text='「你成日忙，我都唔想阻住你。只係最近有啲事情自己做得慢……」';opts=[opt('「你希望我陪你做哪一件事？我們一起安排，也找家人分擔。」',15,'「你肯先問我，我覺得自己仍可以作主。」','尊重自主、共同分工，避免把照顧全壓在一個人身上。','共同決定'),opt('「你甚麼都不要做，我全部幫你決定。」',-7,'「我知道你關心，但我也想自己選。」','代辦所有事不一定符合需要；保留對方能做、想做的部分。','代替決定'),opt('「我很忙，你自己想辦法。」',-12,'「那我不問了……」對話逐漸減少。','無暇幫忙時仍可關心，商議時間或協助尋找支援。','拒絕連結')];}
// 生活條件直接改寫情境與回應方法。
if(a>=6&&S.eventIndex%3===1){if(h.hearing==='聽力較弱'){title='聽不到，不是沒在聽';text='「你講咩？再講一次啦！點解你成日咁細聲？」';opts=[opt('面向長輩、減少背景聲，清楚重說；視像時開字幕。',14,'「這樣清楚多了！我不是不想聽。」','先改善溝通環境，避免把聽力障礙誤當成故意不理。','配合聽力'),opt('「講咗好多次啦！」轉身大叫。',-10,'「我又聽不清，也不敢再問了。」','提高音量不一定改善清晰度；尊重語氣也重要。','失去耐性'),opt('直接不再說話。',-10,'長輩望著你，覺得自己被隔在對話之外。','可改用文字或字幕，先詢問哪種方式方便。','中斷溝通')];}else if(h.mob!=='步行自如'){title='出門前的一句求助';text='「重陽想同你出去坐吓，不過我行得慢，會唔會阻住你？」';opts=[opt('「一起選無障礙路線，中途休息；你想去哪裡？」',14,'「這樣我也能參與，不用一直怕拖累你。」','敬老活動要配合能力與意願，尊重比趕行程重要。','無障礙陪伴'),opt('「那就不要出門，留在家裡吧。」',-8,'「其實我也想有得選……」','行動不便不代表沒有參與社區生活的意願。','剝奪選擇'),opt('「行快少少就得。」',-12,'「我努力也不一定走得快。」','調整環境與步伐，不能把障礙歸咎於不努力。','忽略能力')];}else if(h.vision==='需放大字體'||h.understanding==='需要分步說明'||h.speech==='說話較慢'){title='再教一次，可以嗎？';text='「電話嗰啲字好細，步驟又多……你再教我一次啦，慢慢講。」';opts=[opt('先放大字體，一次示範一步，請對方試做並等候回應。',14,'「我試到一步了！謝謝你等我。」','教人使用科技，要配合視力、理解和表達步伐。','耐心協助'),opt('搶過電話代做，說「你學不會的」。',-10,'「原來你覺得我甚麼都不懂。」','代做或許快，卻失去學習與自主的機會。','低估能力'),opt('「看說明書啦。」',-8,'「我仍看不清，不知道從哪開始。」','先了解阻礙，再選方便閱讀的方式。','忽略障礙')];}else if(x.eco===economies[0]){title='開口之前的猶豫';text='「最近開支緊，聚餐可唔可以唔去咁貴嘅地方？我講多咗，你唔好介意。」';opts=[opt('「謝謝你告訴我。我們一起選負擔得到的活動。」',13,'「不用怕你失望，我也能輕鬆參與。」','陪伴不需要昂貴消費，避免讓經濟壓力變成羞恥。','體諒處境'),opt('「少少錢都介意？」',-12,'「那我不去了。」','金額對不同家庭的意義不同，尊重對方的處境。','忽略處境'),opt('不問意願，向其他人公開他的財務困難。',-10,'「我想自己決定告訴誰。」','幫忙前也要尊重私隱。','尊重私隱')];}}
if(!x.local&&a>=3){ctx+=' 你們不在同一地方，這次在約定的遠距聯絡中交談；可安排下一次電話／視像。';if(a<6)ctx+='幼兒由成人協助連線。'}
if(h.chronic!=='沒有已知長期病')ctx+=' 長輩有定期健康跟進需要；關心時可問是否需要陪診，避免自行改藥。';
return {type:'story',person:x,title,text:aff+' '+text,context:ctx,opts,role:'回應長輩',channel:channel(x),tone};}
function grandStory(x){const a=S.age-x.birthAt,adult=a>=18,h=x.health;let title,text,opts;const context=`${x.role}${a}歲，${x.personality}；${x.eco}。${loc(x)}。${hp(h)}。`;
if(a<3){title='你的叮嚀，成為安全感';text='孫兒哭起來，又轉過頭。你擔心他吃不飽，很想再餵一口。';opts=[opt('先停下，觀察是否疲倦／飽足，與照顧者確認需要。',12,'孫兒逐漸放鬆，照顧者說：「謝謝你留意他的訊號。」','嬰兒不能用成人方式回應。尊重訊號，成人共同負起照顧責任。','回應訊號'),opt('「唔好扭計，為你好！」堅持再餵。',-10,'孫兒哭得更厲害，把頭轉得更遠。','「為你好」不能取代觀察需要；有疑問可向照顧者或專業人員了解。','忽略訊號'),opt('「不想吃就不理你。」轉身走開。',-10,'孫兒哭著尋找熟悉的人。','幼兒需要穩定回應，不能用撤回關愛來管教。','撤回關愛')];}
else if(a<12){title='從「快啲」到「慢慢嚟」';text=h.mob!=='步行自如'?'孫兒想參加節慶活動，但擔心場地不方便。你很想替他安排一切。':'孫兒放學回來只想玩。你忍不住想連問功課、吃飯和成績。';opts=[opt('「你想先做甚麼？我們一起安排，也留點時間聽你說。」',13,'「你肯讓我選？那我也想和你說今天的事。」','先邀請、再商量，給孩子合適的選擇權。','給予選擇'),opt('「快做功課！我講咁多次都唔聽！」',-9,'「又嚟啦，好囉唆！」孫兒轉向別處。','重複命令容易令對方只聽見壓力；可先問卡在哪一步。','重複命令'),opt('「其他小朋友都比你乖。」',-12,'「你只喜歡別人。」孫兒不願再談。','比較會傷害安全感；聚焦具體行為與需要。','避免比較')];}
else if(a<18){title='熟悉的「你好囉唆」';text='孫兒戴著耳機，說：「我知啦！可唔可以唔好成日問我去邊？」你想起自己年少的樣子。';opts=[opt('「我擔心你安全，也明白你想有空間。我們約定一個報平安方式？」',14,'「如果不用每小時追問，我可以出門和回家時報平安。」','把控制轉為共同約定，既關心安全，也尊重成長。','協商界線'),opt('「我食鹽多過你食米，你一定要聽！」',-13,'「你根本不聽我的想法！」孫兒更少主動分享。','閱歷可分享，不能代替聆聽；尊重不是單向要求。','壓制'),opt('「既然嫌煩，以後都不用找我。」',-12,'「我只是想要空間……」孫兒變得沉默。','不要以斷絕關係回應界線；可以說出自己的感受與需要。','情感施壓')];}
else {title=x.local?'把思念說成邀請':'隔著時差的牽掛';text=x.local?'孫兒說：「工作已經很忙，又要聚餐？你成日都係嗰幾句……」':'約定聯絡的時間到了，孫兒說：「這邊好忙，你又打嚟？可唔可以下次先？」';opts=[opt(x.local?'「我想念你。我們選你方便、負擔得到的時間和活動，好嗎？」':'「我想念你。我們先核對時差，約一個固定的15分鐘視像時間？」',14,'「原來你只是想見我。我看看時間，和你定下來。」','說出思念與具體邀請，比責備更容易讓人靠近。','說出需要'),opt('「你唔返嚟／唔接電話就係不孝！」',-13,'「我有壓力，越來越不敢聯絡你。」','孝親不是用愧疚交換服從；把需要說清楚，容許商議。','愧疚壓力'),opt('連續傳十則訊息，要求立即回覆。',-10,'「我想回，但連環訊息令我更煩躁。」','先約好聯絡頻率，尊重工作、時差與休息。','連環追問')];}
if(a>=3&&(h.hearing==='聽力較弱'||h.understanding==='需要分步說明'||h.speech==='說話較慢'||h.vision==='需放大字體'))opts[0].text+=' 我會用清楚文字／字幕，一次說一件事，留時間回應。';
if(a>=3&&!x.local)opts[0].text+=' 我們用電話或視像也能相伴。';return {type:'story',person:x,title,text,context,opts,role:'由你開口',channel:channel(x,true),tone:'換個位置，重新學習關心',grand:true};}
function bridgeStory(){const a=S.age;const topics=[['沒有接通的電話','你翻到長輩以前留下的訊息。那句「食咗飯未」，如今聽起來很不一樣。'],['照顧，也需要被照顧','你在工作與家庭之間奔忙，開始懂得上一代為何總在擔心。'],['把家常留給下一代','農曆新年前，你找到家中的舊食譜，想起團年飯上的笑聲。']];const t=topics[S.eventIndex%3];return {type:'bridge',title:t[0],text:t[1],context:'長輩已相繼離世；懷念可以用自己的方式。此刻，試著把學過的溝通延續到身邊的人。',opts:[opt('與家人分享一段故事，也問問大家需要甚麼。',0,'你們交換記憶，發現每個人記得的細節都不同。','文化傳承並非只重複習俗，也包括彼此聆聽與共同參與。','分享記憶'),opt('先寫下感受，等準備好再與可信任的人談。',0,'你給自己一點空間，為記憶留下一個位置。','每個人的哀傷與表達步伐不同，安靜整理也是一種方法。','整理感受'),opt('邀請家人一起做一道家常菜，不勉強任何人參加。',0,'熟悉的味道開啟了新的對話。','孝親的精神可在日常小事延續，尊重每人的參與意願。','延續文化')],role:'你的選擇'};}
function renderEvent(){const c=current;if(S.feedback){renderFeedback();return}let inner='';if(c.type==='quiz'){const f=c.fact;inner=`<div class="eyebrow">POPULATION LENS / 人口小問答</div><h2>看懂數據，也看見人。</h2><div class="banner"><b>${f.org} · ${f.big}</b><br>${f.text}</div><h3>${f.q}</h3><div class="choices">${f.opts.map((o,i)=>`<button class="choice" onclick="choose(${i})"><span class="letter">${'ABC'[i]}</span><span>${o}</span></button>`).join('')}</div>`}else if(c.type==='death'||c.type==='birth'){inner=`<div class="eyebrow">${c.type==='death'?'A MOMENT TO REMEMBER / 記得與珍惜':'A NEW CHAPTER / 新的牽掛'}</div><h2>${esc(c.title)}</h2><div class="dialogue">${esc(c.text)}</div><p class="context">${esc(c.context)}</p>${c.type==='death'?`<div class="banner">你們留下的關係：${c.person.bond}/100。這只是互動記錄，不能衡量一段關係全部的愛。<br>可以休息片刻，不必急著作答。</div>`:''}<div class="actionrow"><button onclick="acknowledge()">${c.type==='death'?'把回憶帶在身邊 →':'帶著關心，繼續 →'}</button><button class="outline" onclick="togglePause()">暫停／繼續推進</button></div>`}else{inner=`<div class="eyebrow">${esc(c.role)} / ${c.grand?'下一代的故事':'成長中的相遇'}</div><h2>${esc(c.title)}</h2>${c.person?`<div class="speaker"><span class="avatar" aria-hidden="true">${c.grand?'🧑':c.person.sex==='男'?'👴':'👵'}</span><div><b>${esc(c.person.role)} · ${c.grand?S.age-c.person.birthAt:c.person.startAge+S.age}歲</b><div class="small">${esc(c.channel)} · ${esc(c.person.personality)}</div></div></div>`:''}<p class="context">${esc(c.context)}</p><div class="dialogue">${esc(c.text)}</div><div class="small">${c.grand?'你會怎樣開口？':'你會怎樣回應？'}${c.tone?' · '+esc(c.tone):''}</div><div class="choices">${c.opts.map((o,i)=>`<button class="choice" onclick="choose(${i})"><span class="letter">${'ABC'[i]}</span><span>${esc(o.text)}</span></button>`).join('')}</div>`}shell(inner)}
function choose(i){if(S.feedback)return;const c=current;if(c.type==='quiz'){const f=c.fact,ok=i===f.answer;S.quizCorrect+=ok?1:0;S.quizDone.push(S.pending.key);S.feedback={title:ok?'你留意到關鍵了。':'再想一想資料的意思。',reply:`你選擇：${f.opts[i]}\n參考答案：${f.opts[f.answer]}`,lesson:f.note,delta:null};S.log.push({age:S.age,kind:'quiz',title:'人口小問答',choice:f.opts[i],response:f.note,tag:ok?'答對':'一起學習'});}else{const o=c.opts[i],x=c.person;let delta=o.d,reply=o.reply;if(x){if(c.grand&&S.age-x.birthAt>=3){if(x.personality==='直率急性'&&o.d>0){delta-=3;reply='「我知道你關心，但現在仍覺得有點囉唆，給我一點時間。」你留了空間，對話得以繼續。'}else if(x.personality==='內斂慢熱'&&o.d>0){delta-=2;reply='「嗯……我想慢慢說。」你等候回應，沒有催促。'}else if(x.bond<35&&o.d>0){delta-=4;reply='「你真的會聽嗎？我暫時還未放心。」你先遵守這次約定，讓信任慢慢累積。'}if(x.eco===economies[0]&&o.d>0)reply+=' 對方補充：「活動可以簡單一點嗎？我最近要控制開支。」';}const before=x.bond;x.bond=clamp(x.bond+delta);delta=x.bond-before;x.pattern=x.bond>=70?'更願意分享':x.bond<30?'生疏，互相防備':x.bond<45?'擔心，提醒變多':o.d>0?'慢慢靠近':'對話有點緊張';}S.feedback={title:x?`${x.role}的回應`:'留在心裡的一刻',reply,lesson:o.lesson,delta:x?delta:null};S.log.push({age:S.age,kind:'story',person:x?.role??'家人',title:c.title,choice:o.text,response:reply,lesson:o.lesson,tag:o.tag,delta:x?delta:0});S.done.push(S.age);S.eventIndex++;}save();renderFeedback()}
function renderFeedback(){const f=S.feedback;const entry=S.log[S.log.length-1];shell(`<div class="eyebrow">A CONVERSATION / 相處的回聲</div><h2>${esc(f.title)}</h2><p class="context">你選擇：${esc(entry.choice)}</p><div class="dialogue" style="white-space:pre-line">${esc(f.reply)}</div>${f.delta!==null?`<span class="pill">親密度 ${f.delta>=0?'+':''}${f.delta}</span>`:''}<div class="feedback"><b>換個角度看</b>${esc(f.lesson)}</div><div class="actionrow"><button onclick="continueAfter()">繼續人生 →</button><button class="outline" onclick="showFamily()">再了解家人</button></div><p class="small" style="margin-top:15px">一次不理想的回應仍可修補。接下來的耐心與守約，會慢慢改變關係。</p>`)}
function acknowledge(){const c=current,x=c.person;if(c.type==='death'){x.dead=true;S.deaths.push(x.id);S.log.push({age:S.age,kind:'death',person:x.role,title:x.role+'離世',response:'記下相處的片段，把思念帶進往後的生活。',bond:x.bond})}else{S.births.push(x.id);S.log.push({age:S.age,kind:'birth',person:x.role,title:x.role+'出生',response:x.id[0]==='g'?'從此，你也成為了長輩。':'學習共同照顧與分擔。'})}continueAfter()}
function continueAfter(){delete S.feedback;delete S.pending;current=null;S.mode='travel';save();advance(true)}
function summary(){stopTimer();const stories=S.log.filter(l=>l.kind==='story'),positive=stories.filter(l=>l.delta>0).length,ref=S.ref;const farewell=S.age>=85;const memories=S.log.filter(l=>l.kind!=='quiz');$('main').innerHTML=`<div class="summaryhero"><div class="eyebrow">EPILOGUE / 把陪伴帶回今天</div><h1>85年走完了。<br>愛，留在每一次願意聽。</h1><p>${esc(S.p.name)}在85歲這一年離世。這是遊戲設定的人生終點。<br>從長輩的叮嚀，到自己對子孫的牽掛，你曾怎樣靠近彼此？</p></div><div class="metrics"><div class="metric"><strong>${stories.length}</strong>次對話與選擇</div><div class="metric"><strong>${positive}</strong>次讓關係靠近</div><div class="metric"><strong>${S.quizCorrect}/4</strong>人口知識題</div></div><div class="banner">沒有一個分數能概括孝心。關係受彼此的性格、生活處境與溝通影響；即使你用心，對方也可能需要時間。請留意你曾問過甚麼、聽見甚麼，以及下次可以怎樣做。</div><section class="panel"><h2>你留下的關係</h2><div class="familygrid">${[...S.elders,...S.grand].map(x=>`<div class="profile"><h3>${esc(x.role)}</h3><p>${x.dead?'已離世 · 留下回憶':'在你的生命中繼續成長'}</p><b>${x.bond}/100 · ${esc(x.pattern)}</b><div class="meter"><div style="width:${x.bond}%"></div></div></div>`).join('')}</div><details><summary>展開85年的相處足跡（${memories.length}個片段）</summary><div class="timeline">${memories.map(l=>`<div class="memory"><b>${l.age}歲 · ${esc(l.title)}${l.person?' · '+esc(l.person):''}</b>${l.choice?`<p>你的選擇：${esc(l.choice)}</p>`:''}<p>${esc(l.response)}</p>${l.lesson?`<p class="muted">${esc(l.lesson)}</p>`:''}</div>`).join('')}</div></details></section><section class="panel" style="margin-top:22px"><div class="eyebrow">REFLECTION / 珍惜，從今天開始</div><h2>如果今天還來得及。</h2><div class="reflectgrid"><div><label for="minutes">平日每週約花多少分鐘陪伴／聯絡長輩？</label><input id="minutes" type="number" min="0" max="10080" value="${esc(ref.minutes)}" placeholder="例如：30" oninput="updateRef('minutes',this.value)"><p class="small">沒有標準答案；想想其中有多少是專心聆聽的時間。</p></div><div><label for="need">我想進一步了解長輩的甚麼需要？</label><textarea id="need" placeholder="例如：覆診交通、想見的人、喜歡的活動……" maxlength="500" oninput="updateRef('need',this.value)">${esc(ref.need)}</textarea></div><div><label for="feeling">換成長輩後，我對「囉唆」有甚麼新體會？</label><textarea id="feeling" placeholder="我聽到的可能是……我也希望被尊重的是……" maxlength="500" oninput="updateRef('feeling',this.value)">${esc(ref.feeling)}</textarea></div><div><label for="action">未來7天，我會做的一件具體小事</label><textarea id="action" placeholder="何時、與誰、做甚麼？先問對方是否方便。" maxlength="500" oninput="updateRef('action',this.value)">${esc(ref.action)}</textarea></div></div><div class="actionrow"><button onclick="shareDialog()">預覽及分享人生回顧 ↗</button><button class="outline" onclick="window.print()">列印／另存PDF</button><button class="outline" onclick="downloadReflection()">下載文字回顧</button><button class="secondary" onclick="restartDialog()">再走另一段人生</button></div><p class="small" style="margin-top:15px">若親人已不在身邊，也可以整理記憶、關心信任的年長親友或參與社區關懷。毋須勉強自己。</p></section>`}
function updateRef(k,v){S.ref[k]=v;save()}
function shareText(){const r=S.ref,st=S.log.filter(l=>l.kind==='story'),first=st.find(l=>l.delta>0),last=[...st].reverse().find(l=>l.delta>0);return `「不怕囉唆&最怕生疏」｜我的85年陪伴回顧\n${r.includeName?'玩家：'+S.p.name+'\n':''}我走過了${st.length}次對話，從聽長輩叮嚀，到學習成為長輩。\n${first?'一次靠近：'+first.age+'歲，'+first.title+'；我選擇「'+first.choice+'」。\n':''}${last&&last!==first?'後來的領悟：'+last.age+'歲，'+last.title+'；'+last.lesson+'\n':''}每週陪伴／聯絡：約${r.minutes!==''?r.minutes:'（尚未填寫）'}分鐘。\n我想了解的需要：${r.need||'（尚未填寫）'}\n我的新體會：${r.feeling||'（尚未填寫）'}\n未來7天的行動：${r.action||'（尚未填寫）'}\n陪伴不在話多話少，而在願意理解與尊重。\n#不怕囉唆最怕生疏 #孝親 #同理心`}
function shareDialog(){modal('分享前，先看一看',`<p class="small">只分享下方內容，不包含隱藏壽命及完整家庭設定。請避免填入家人的私密健康或財務資料。</p><label class="small"><input type="checkbox" id="shareName" style="width:auto;min-height:0" ${S.ref.includeName?'checked':''}> 在回顧中加入我的姓名／暱稱</label><div id="sharePreview" class="sharepreview" style="margin-top:15px"></div><div class="actionrow"><button onclick="nativeShare()">使用裝置分享</button><button class="secondary" onclick="shareWhatsApp()">WhatsApp</button><button class="secondary" onclick="shareX()">X</button><button class="outline" onclick="copyText()">複製文字（可貼到其他社交媒體）</button></div><details><summary>X精簡版預覽</summary><p id="xPreview"></p></details><div id="shareStatus" class="small" role="status" style="margin-top:15px"></div>`);$('sharePreview').textContent=shareText();$('xPreview').textContent=xText();$('shareName').onchange=e=>{S.ref.includeName=e.target.checked;save();$('sharePreview').textContent=shareText()}}
async function nativeShare(){if(navigator.share){try{await navigator.share({title:'不怕囉唆&最怕生疏',text:shareText()});$('shareStatus').textContent='已交由裝置的分享功能處理。'}catch(e){$('shareStatus').textContent=e.name==='AbortError'?'已取消分享。':'此裝置未能分享，請改用複製文字或下載回顧。'}}else{await copyText()}}
async function copyText(){try{await navigator.clipboard.writeText(shareText());$('shareStatus').textContent='已複製，可自行貼到社交媒體。'}catch(e){const range=document.createRange();range.selectNodeContents($('sharePreview'));getSelection().removeAllRanges();getSelection().addRange(range);$('shareStatus').textContent='瀏覽器未允許自動複製；已選取文字，請長按或按Ctrl+C複製。'}}
function shareWhatsApp(){window.open('https://wa.me/?text='+encodeURIComponent(shareText()),'_blank','noopener,noreferrer')}
function xText(){return '我完成了「不怕囉唆&最怕生疏」85年陪伴旅程。未來7天，我想：'+(S.ref.action||'主動聆聽長輩的需要。')+' #孝親 #同理心'}
function shareX(){window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(xText()),'_blank','noopener,noreferrer');$('shareStatus').textContent='X分享視窗使用精簡版：遊戲名稱、7天行動及標籤。請在發佈前檢查字數。'}
function downloadReflection(){const blob=new Blob([shareText()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='family85-reflection.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restartDialog(){modal('再展開一段人生？','<p>新旅程會覆蓋這個瀏覽器的進度。你可以先下載文字回顧。</p><div class="actionrow"><button onclick="downloadReflection()">先下載回顧</button><button class="secondary" onclick="resetGame()">重新開始</button><button class="outline" onclick="closeModal()">保留這段人生</button></div>')}
function resetGame(){closeModal();stopTimer();try{localStorage.removeItem(KEY)}catch(e){}home()}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S){stopTimer();if(S.mode==='travel'){S.running=false;save();render()}}});
home();
</script></body></html>
